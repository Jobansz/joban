<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alarm · Joban</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="style.css?v=5">
<style>
  .al { display: flex; flex-direction: column; gap: 14px; max-width: 640px; }
  .al-card { background: var(--cream); color: var(--ink); border-radius: 18px; padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; }
  .al-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; opacity: 0.7; }
  .al input[type=password], .al input[type=time], .al select {
    font: inherit; padding: 10px 12px; border-radius: 10px; border: 1.5px solid #d6cbb8; background: #fff; color: var(--ink);
  }
  .al button { font: inherit; font-weight: 600; padding: 11px 16px; border-radius: 10px; border: 0; background: var(--navy); color: var(--cream); cursor: pointer; }
  .al button.alt { background: transparent; color: var(--navy); border: 1.5px solid var(--navy); }
  .al button:disabled { opacity: .45; cursor: default; }
  .day { display: grid; grid-template-columns: 56px 1fr auto; align-items: center; gap: 12px; padding: 6px 0; border-bottom: 1px solid #e7dccb; }
  .day:last-child { border-bottom: 0; }
  .day b { font-family: 'Fraunces', serif; font-size: 1.15rem; }
  .day input[type=time]:disabled { opacity: .35; }
  .sw { position: relative; width: 50px; height: 30px; flex: none; }
  .sw input { opacity: 0; width: 0; height: 0; }
  .sw span { position: absolute; inset: 0; border-radius: 99px; background: #cfc4b2; transition: .2s; cursor: pointer; }
  .sw span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: .2s; }
  .sw input:checked + span { background: var(--tomato); }
  .sw input:checked + span::after { transform: translateX(20px); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .range { display: grid; grid-template-columns: 1fr 48px; gap: 10px; align-items: center; }
  .range input { width: 100%; accent-color: var(--tomato); }
  .msg { font-size: 0.9rem; min-height: 1.4em; }
  .msg.err { font-weight: 600; }
  .tomato > .pad > .al > .al > .row .alt, #logout { color: var(--cream); border-color: var(--cream); }
  #msg.err, #loginMsg.err { background: var(--cream); color: var(--wine); padding: 4px 10px; border-radius: 8px; }
  #save { background: var(--cream); color: var(--wine); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<nav><a class="logo" href="index.html">Joban</a><ul><li><a href="index.html">Home</a></li><li><a href="projects.html">Projects</a></li><li><a href="apps.html">Apps</a></li><li><a href="lifestyle.html">Lifestyle</a></li><li><a href="socials.html">Socials</a></li></ul></nav>

<section class="block full tomato" style="min-height:0">
  <div class="pad">
    <span class="eyebrow">Morning Paper</span>
    <h1 class="big">Alarm</h1>

    <div class="al">
      <!-- login -->
      <form id="login" class="al-card">
        <span class="al-label">Password</span>
        <div class="row">
          <input id="pw" type="password" autocomplete="current-password" required style="flex:1;min-width:180px">
          <button type="submit">Unlock</button>
        </div>
        <div class="msg" id="loginMsg"></div>
      </form>

      <!-- settings -->
      <div id="app" class="al hidden">
        <div class="al-card">
          <span class="al-label">Wake up at</span>
          <div id="days"></div>
        </div>

        <div class="al-card">
          <span class="al-label">Chime</span>
          <div class="row">
            <select id="sound" style="flex:1">
              <option value="bells">Bells</option>
              <option value="marimba">Marimba</option>
              <option value="soft-rise">Soft rise</option>
            </select>
            <button type="button" class="alt" id="preview">▶ Preview</button>
          </div>
          <span class="al-label">Volume</span>
          <div class="range"><input id="volume" type="range" min="1" max="10"><span id="volumeVal"></span></div>
          <span class="al-label">Fade in</span>
          <div class="range"><input id="fade" type="range" min="0" max="120" step="5"><span id="fadeVal"></span></div>
          <span class="al-label">Snooze</span>
          <div class="range"><input id="snooze" type="range" min="1" max="30"><span id="snoozeVal"></span></div>
        </div>

        <div class="row">
          <button id="save" disabled>Save</button>
          <button class="alt" id="logout" type="button">Lock</button>
          <span class="msg" id="msg"></span>
        </div>
      </div>
    </div>
  </div>
</section>

<script>
const API = "https://paper-settings.jobanxy.workers.dev";
const DAYS = [["mon","Mon"],["tue","Tue"],["wed","Wed"],["thu","Thu"],["fri","Fri"],["sat","Sat"],["sun","Sun"]];
const $ = (id) => document.getElementById(id);

let token = null, sha = null, settings = null, dirty = false;
try { token = localStorage.getItem("paperToken"); } catch {}

function msg(el, text, err) { el.textContent = text; el.classList.toggle("err", !!err); }

async function api(path, opts = {}) {
  const r = await fetch(API + path, {
    ...opts,
    headers: { "Content-Type": "application/json", ...(token ? { Authorization: "Bearer " + token } : {}) },
  });
  const data = await r.json().catch(() => ({}));
  if (r.status === 401 && path !== "/login") { lock(); throw new Error("Please log in again."); }
  if (!r.ok) throw new Error(data.error || "Something went wrong.");
  return data;
}

$("login").addEventListener("submit", async (e) => {
  e.preventDefault();
  msg($("loginMsg"), "Checking…");
  try {
    const d = await api("/login", { method: "POST", body: JSON.stringify({ password: $("pw").value }) });
    token = d.token;
    try { localStorage.setItem("paperToken", token); } catch {}
    $("pw").value = "";
    msg($("loginMsg"), "");
    load();
  } catch (err) { msg($("loginMsg"), err.message, true); }
});

function lock() {
  token = null;
  try { localStorage.removeItem("paperToken"); } catch {}
  $("app").classList.add("hidden");
  $("login").classList.remove("hidden");
}
$("logout").addEventListener("click", lock);

async function load() {
  $("login").classList.add("hidden");
  $("app").classList.remove("hidden");
  msg($("msg"), "Loading…");
  try {
    const d = await api("/settings");
    settings = d.settings; sha = d.sha;
    render();
    msg($("msg"), "");
  } catch (err) { msg($("msg"), err.message, true); }
}

function render() {
  $("days").innerHTML = "";
  for (const [key, label] of DAYS) {
    const v = settings.alarm[key];
    const on = v !== "off";
    const row = document.createElement("div");
    row.className = "day";
    row.innerHTML = `<b>${label}</b><input type="time" value="${on ? v : "07:30"}" ${on ? "" : "disabled"}>
      <label class="sw"><input type="checkbox" ${on ? "checked" : ""}><span></span></label>`;
    const time = row.querySelector("input[type=time]");
    const sw = row.querySelector("input[type=checkbox]");
    const update = () => { time.disabled = !sw.checked; settings.alarm[key] = sw.checked ? (time.value || "07:30") : "off"; changed(); };
    time.addEventListener("change", update);
    sw.addEventListener("change", update);
    $("days").appendChild(row);
  }
  $("sound").value = settings.chime.sound;
  bindRange("volume", settings.chime.volume, (v) => (settings.chime.volume = v), (v) => v);
  bindRange("fade", settings.chime.fade_in_seconds, (v) => (settings.chime.fade_in_seconds = v), (v) => (v ? v + "s" : "off"));
  bindRange("snooze", settings.snooze_minutes, (v) => (settings.snooze_minutes = v), (v) => v + "m");
  dirty = false; $("save").disabled = true;
}

function bindRange(id, value, set, fmt) {
  const el = $(id), out = $(id + "Val");
  el.value = value; out.textContent = fmt(value);
  el.oninput = () => { const v = Number(el.value); set(v); out.textContent = fmt(v); changed(); };
}
$("sound").addEventListener("change", () => { settings.chime.sound = $("sound").value; changed(); });

function changed() { dirty = true; $("save").disabled = false; msg($("msg"), ""); }

$("save").addEventListener("click", async () => {
  $("save").disabled = true;
  msg($("msg"), "Saving…");
  try {
    const d = await api("/settings", { method: "PUT", body: JSON.stringify({ settings, sha }) });
    sha = d.sha; settings = d.settings; dirty = false;
    msg($("msg"), "Saved. The paper picks it up at 4:30am.");
  } catch (err) { $("save").disabled = false; msg($("msg"), err.message, true); }
});

// ---------- chime preview (same three sounds the device plays) ----------
let ctx;
$("preview").addEventListener("click", () => {
  ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
  const vol = Number($("volume").value) / 10 * 0.5;
  const sound = $("sound").value;
  const now = ctx.currentTime;
  const note = (freq, t, len, partials, gain) => {
    for (const [mult, amp] of partials) {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine"; o.frequency.value = freq * mult;
      g.gain.setValueAtTime(0.0001, now + t);
      g.gain.exponentialRampToValueAtTime(gain * amp, now + t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, now + t + len);
      o.connect(g).connect(ctx.destination);
      o.start(now + t); o.stop(now + t + len + 0.05);
    }
  };
  if (sound === "bells") {
    [659, 784, 988, 784].forEach((f, i) => note(f, i * 0.45, 2.2, [[1, 1], [2.76, 0.4], [5.4, 0.15]], vol));
  } else if (sound === "marimba") {
    [523, 659, 784, 1047, 784, 659].forEach((f, i) => note(f, i * 0.22, 0.6, [[1, 1], [4, 0.25]], vol));
  } else {
    [392, 494, 587, 784].forEach((f, i) => note(f, i * 0.8, 2.8, [[1, 1], [2, 0.2]], vol * (0.4 + i * 0.2)));
  }
});

window.addEventListener("beforeunload", (e) => { if (dirty) e.preventDefault(); });
if (token) load();
</script>
